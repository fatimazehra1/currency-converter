# Render Blueprint for the NestJS backend.
# Optional: you can configure the same values by hand in Render's dashboard.
# Import this file via Render -> New -> Blueprint.

services:
  - type: web
    name: currency-converter-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      # Required. Without this the backend allows any localhost origin
      # (a development-only convenience) instead of only CORS_ORIGINS.
      - key: NODE_ENV
        value: production
      # sync: false means "ask me for this value in the dashboard".
      # The secret is NEVER written into this committed file.
      - key: FREECURRENCY_API_KEY
        sync: false
      # Set this to your deployed Netlify URL, e.g.
      # https://your-app.netlify.app  (no trailing slash)
      - key: CORS_ORIGINS
        sync: false
